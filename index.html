<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Track It! — Dein minimalistischer Workout-Tracker. Offline, lokal, privat.">
    <meta name="theme-color" content="#0f0e0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <title>Track It!</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">

    <link rel="preload" href="./fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="./design-tokens.css">
    <link rel="stylesheet" href="./css/styles.css">

    <script src="./vendor/lucide.min.js"></script>
    <script>
        // iOS vibration via ios-vibrator-pro-max; can be switched off in settings
        if (localStorage.getItem('trackit-ios-haptics') !== 'off') {
            document.write('<script src="./vendor/ios-vibrator-pro-max.js"><\/script>');
        }
    </script>
    <script src="./vendor/web-haptics.js"></script>
    <script>
        const savedTheme = localStorage.getItem('trackit-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>

<body>
    <!-- iOS colours the status bar from a fixed bar at the top edge; with no
         bar there (e.g. before the header is rendered) it blurs the top of the
         app instead, for as long as it stays open. This strip is there from the
         first frame and never changes, so iOS always finds it. -->
    <div id="top-edge" aria-hidden="true"></div>
    <div id="app"></div>
    <script src="./js/utils.js"></script>
    <script src="./js/db.js"></script>
    <script src="./js/copy.js"></script>
    <script src="./js/exercises.js"></script>
    <script src="./js/form-history.js"></script>
    <script src="./js/rest-timer.js"></script>

    <script src="./js/components/icons.js"></script>
    <script src="./js/components/header.js"></script>
    <script src="./js/components/toast.js"></script>
    <script src="./js/components/modal.js"></script>

    <script src="./js/pages/home.js"></script>
    <script src="./js/pages/history.js"></script>
    <script src="./js/pages/workout-detail.js"></script>
    <script src="./js/pages/create-workout.js"></script>
    <script src="./js/pages/settings.js"></script>
    <script src="./js/pages/exercise.js"></script>

    <script src="./js/app.js"></script>

</body>

</html>
