<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <!-- First frame: theme and background before any file loads, so launch
         never flashes white -->
    <script>
        const savedTheme = localStorage.getItem('trackit-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <style>
        html { background: #0f0e0c; color-scheme: dark; }
        html[data-theme="oled"] { background: #000000; }
        html[data-theme="light"] { background: #f0efeb; color-scheme: light; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Track It! — Dein minimalistischer Workout-Tracker. Offline, lokal, privat.">
    <meta name="theme-color" content="#0f0e0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Track It!</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">

    <link rel="preload" href="./fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="./design-tokens.css">
    <link rel="stylesheet" href="./css/styles.css">

    <script src="./vendor/lucide.min.js"></script>
    <script>
        // iOS vibration via ios-vibrator-pro-max; can be switched off in settings
        if (localStorage.getItem('trackit-ios-haptics') !== 'off') {
            document.write('<script src="./vendor/ios-vibrator-pro-max.js"><\/script>');
        }
    </script>
    <script src="./vendor/web-haptics.js"></script>
</head>

<body>
    <!-- The app shell is plain HTML so it is on screen from the first frame;
         scripts only fill #app-content. -->
    <div id="app">
        <header class="app-header">
        <div class="header-inner">
        <a href="#/" class="header-brand" aria-label="Track It! Startseite">
        <span class="header-title">Track <b>It!</b></span>
        </a>
        <nav class="header-nav" aria-label="Hauptnavigation">
        <a href="#/" class="nav-link" data-nav="home" aria-label="Startseite"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-lucide="home" class="lucide lucide-home"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></a>
        <a href="#/history" class="nav-link" data-nav="history" aria-label="Verlauf"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-lucide="history" class="lucide lucide-history"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg></a>
        <a href="#/settings" class="nav-link" data-nav="settings" aria-label="Einstellungen"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-lucide="settings" class="lucide lucide-settings"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg></a>
        </nav>
        </div>
        </header>
        <main id="app-content" class="app-content"></main>
    </div>
    <script src="./js/utils.js"></script>
    <script src="./js/db.js"></script>
    <script src="./js/copy.js"></script>
    <script src="./js/exercises.js"></script>
    <script src="./js/form-history.js"></script>
    <script src="./js/rest-timer.js"></script>

    <script src="./js/components/icons.js"></script>
    <script src="./js/components/header.js"></script>
    <script src="./js/components/toast.js"></script>
    <script src="./js/components/modal.js"></script>

    <script src="./js/pages/home.js"></script>
    <script src="./js/pages/history.js"></script>
    <script src="./js/pages/workout-detail.js"></script>
    <script src="./js/pages/create-workout.js"></script>
    <script src="./js/pages/settings.js"></script>
    <script src="./js/pages/exercise.js"></script>

    <script src="./js/app.js"></script>

</body>

</html>
